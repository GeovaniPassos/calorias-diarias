</div>
<div class="tabela-itens-selecionados">
  <h3>Alimentos Selecionados</h3>
  <table mat-table [dataSource]="alimentosSelecionados" class="mat-elevation-z8">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef> Nome </th>
      <td mat-cell *matCellDef="let item"> {{item.nome}} </td>
    </ng-container>

    <ng-container matColumnDef="quantidade">
      <th mat-header-cell *matHeaderCellDef> Quantidade </th>
      <td mat-cell *matCellDef="let item"> {{item.quantidade}} </td>
    </ng-container>

    <ng-container matColumnDef="calorias">
      <th mat-header-cell *matHeaderCellDef> Calorias </th>
      <td mat-cell *matCellDef="let item"> {{item.calorias}} </td>
    </ng-container>

    <ng-container matColumnDef="proteinas">
      <th mat-header-cell *matHeaderCellDef> Proteínas </th>
      <td mat-cell *matCellDef="let item"> {{item.proteinas}} </td>
    </ng-container>

    <ng-container matColumnDef="carboidratos">
      <th mat-header-cell *matHeaderCellDef> Carboidratos </th>
      <td mat-cell *matCellDef="let item"> {{item.carboidratos}} </td>
    </ng-container>

    <ng-container matColumnDef="gorduras">
      <th mat-header-cell *matHeaderCellDef> Gorduras </th>
      <td mat-cell *matCellDef="let item"> {{item.gorduras}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
